name: Finder vakansiya boti

on:
  schedule:
    # Har 15 daqiqada, kun bo'yi (qo'lda qo'shilgan e'lonlar istalgan vaqtda chiqishi uchun)
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:   # "Run workflow" tugmasi yoki Telegram admin paneli ishga tushiradi

permissions:
  contents: write      # state.json ni saqlash uchun

concurrency:
  group: finder-bot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Botni bir marta ishga tushirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          START_DATE: ${{ vars.START_DATE }}
          USD_RATE: ${{ vars.USD_RATE || '12000' }}
        run: python bot.py --tick

      - name: Holatni (state.json) saqlash
        run: |
          git config user.name "finder-bot"
          git config user.email "finder-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "bot holati yangilandi"
          # admin panel shu orada boshqa fayllarni o'zgartirgan bo'lishi mumkin
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
